name = "controle-financeiro"
main = "src/index.js"
compatibility_date = "2025-04-01"
account_id = "117e60056bd81bcde181d4733bb8886c"
workers_dev = true

# Os arquivos de public/ são embutidos no Worker (src/estaticos.js)
[build]
command = "node scripts/embutir.mjs"
watch_dir = "public"

[vars]
# Nomes que aparecem no app (separados por vírgula)
PESSOAS = "Marido,Esposa"
# Chave pública das notificações (a privada fica no segredo VAPID_PRIVADA)
VAPID_PUBLICA = "BO9s2aPJy6fN4hInPh4SPjpF4MJsKH91kZlu1WEZUes4dgAygsTx1Zumqocmka7XxXc22IXIXjhGx8AvFmOm4bQ"

# Banco de dados: Durable Object com SQLite (plano grátis)
[[durable_objects.bindings]]
name = "CASA"
class_name = "Casa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Casa"]

# Busca automática no Meu Pluggy (UTC): 06h, 12h, 18h e 00h — o plano grátis atualiza a cada 24 h
[triggers]
crons = ["0 */6 * * *"]
