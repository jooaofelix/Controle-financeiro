name = "controle-financeiro"
main = "src/index.js"
compatibility_date = "2025-04-01"
account_id = "117e60056bd81bcde181d4733bb8886c"
workers_dev = true

# Os arquivos de public/ são embutidos no Worker (src/estaticos.js)
[build]
command = "node scripts/embutir.mjs"
watch_dir = "public"

[vars]
# Nomes que aparecem no app (separados por vírgula)
PESSOAS = "Marido,Esposa"

# Banco de dados: Durable Object com SQLite (plano grátis)
[[durable_objects.bindings]]
name = "CASA"
class_name = "Casa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Casa"]
